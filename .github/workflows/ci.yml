# Checks for Agentry Sandbox.
#   push to develop          typecheck and tests, and the service image builds
#   pull request to main     the same, and a check that package.json names a version not yet released
# The service image is published to GHCR only after the merge (see publish.yml).
name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  version:
    name: Version not yet released
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check package.json version against the release tags
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error file=package.json::Version $version is already released (tag v$version). Bump it on develop: npm version minor --no-git-tag-version (or patch / major / an exact version)."
            exit 1
          fi
          if ! scripts/ci/release-notes.sh "$version" | grep -q .; then
            echo "::warning file=CHANGELOG.md::No \"## $version\" section in CHANGELOG.md; the release notes will be generated from the commits."
          fi

  image:
    name: Service image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=service
          cache-to: type=gha,mode=max,scope=service

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentry
          POSTGRES_PASSWORD: agentry
          POSTGRES_DB: agentry_sandbox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentry" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      AGENTRY_SANDBOX_TEST_DATABASE_URL: postgres://agentry:agentry@127.0.0.1:5432/agentry_sandbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The Docker integration suites need the real images.
      - run: bash scripts/images-build.sh
      - run: pnpm test
