name: Images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/envd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fakhrulfaiz/agentry-envd:envd-v0.6.13
          cache-from: type=gha,scope=envd
          cache-to: type=gha,mode=max,scope=envd
      - uses: docker/build-push-action@v6
        with:
          context: images/dsh-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fakhrulfaiz/agentry-dsh-runtime:0.2.2-rc.1
          cache-from: type=gha,scope=dsh-runtime
          cache-to: type=gha,mode=max,scope=dsh-runtime
      - uses: docker/build-push-action@v6
        with:
          context: images/sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fakhrulfaiz/agentry-sandbox:1
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - uses: docker/build-push-action@v6
        with:
          context: images/sandbox-browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fakhrulfaiz/agentry-sandbox-browser:1
          cache-from: type=gha,scope=sandbox-browser
          cache-to: type=gha,mode=max,scope=sandbox-browser
      - uses: docker/build-push-action@v6
        with:
          context: images/netguard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fakhrulfaiz/agentry-netguard:1
          cache-from: type=gha,scope=netguard
          cache-to: type=gha,mode=max,scope=netguard
