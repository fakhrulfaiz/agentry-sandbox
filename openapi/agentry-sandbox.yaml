openapi: 3.1.0
info:
  title: Agentry Sandbox
  version: 0.1.0
  description: >-
    Hardened sandboxes on demand. Every route except /v1/health needs
    `Authorization: Bearer <key>` and `X-Agentry-Owner`. Records are scoped to
    that owner: another owner's id answers 404 like a missing one. Times are
    epoch seconds.
servers:
  - url: http://127.0.0.1:3090
security:
  - bearer: []
paths:
  /v1/health:
    get:
      summary: Liveness
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema: { type: object, properties: { ok: { const: true } } }
  /v1/backends:
    get:
      summary: Places (enabled ones, default first) and their availability
      parameters: [{ $ref: "#/components/parameters/Owner" }]
      responses:
        "200":
          description: One entry per enabled place.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Backend" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/sandboxes:
    post:
      summary: Create a sandbox (and start it)
      parameters: [{ $ref: "#/components/parameters/Owner" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                template_id: { type: string, description: "A stored template; `template` fields override it." }
                place: { type: string, description: "Id of the place to run on (from /v1/backends); else the template's, else the default place." }
                template: { $ref: "#/components/schemas/TemplateSpec" }
                snapshot: { type: string, pattern: "^snap_[0-9a-f]{32}$", description: "One of the owner's ready snapshots to start from. A `workspace` snapshot is unpacked over the template's files (any place); a `disk` or `memory` snapshot makes the sandbox from the snapshot itself and runs only on the place that took it." }
      responses:
        "201": { $ref: "#/components/responses/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      summary: List sandboxes
      parameters: [{ $ref: "#/components/parameters/Owner" }]
      responses:
        "200":
          description: The owner's sandboxes, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { const: list }
                  data: { type: array, items: { $ref: "#/components/schemas/Sandbox" } }
  /v1/sandboxes/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Owner" }]
    get:
      summary: Get a sandbox
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a sandbox and its workspace
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/start:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Owner" }]
    post:
      summary: Start a stopped sandbox
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/stop:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Owner" }]
    post:
      summary: Stop a sandbox (installed software and files are kept)
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/reset:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Owner" }]
    post:
      summary: Rebuild a sandbox from its template
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keep_workspace: { type: boolean, default: true }
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/snapshots:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Owner" }]
    post:
      summary: Take a snapshot of a sandbox (in the background)
      description: >-
        Answers 202 with the snapshot in `saving`; it becomes `ready` or `failed` (with `error`). Poll
        `GET /v1/snapshots/{id}`. A `workspace` snapshot is a tar of the workspace folder kept on the service host
        (needs `AGENTRY_SANDBOX_SNAPSHOT_DIR`, else 400 `snapshots_off`), restorable on any place; a stopped sandbox
        is started for it and stopped again. `disk` and `memory` are the place's own (see `snapshots` on
        `/v1/backends`); a level the place cannot do answers 400 naming it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                level: { enum: [workspace, disk, memory], default: workspace }
                stop_first: { type: boolean, default: false, description: "Stop the sandbox, snapshot, start it again (place-native snapshots; a workspace snapshot of a running sandbox is always taken live)." }
      responses:
        "202": { $ref: "#/components/responses/Snapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Owner" }]
    post:
      summary: Restore a snapshot into a sandbox
      description: >-
        `workspace` replaces the workspace files in place (running or stopped sandbox). `disk` and `memory` rebuild
        the sandbox from the snapshot on its own place, like a reset. Both ids are owner-checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot]
              properties:
                snapshot: { type: string, pattern: "^snap_[0-9a-f]{32}$" }
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/snapshots:
    get:
      summary: List snapshots
      parameters:
        - { $ref: "#/components/parameters/Owner" }
        - { name: sandbox, in: query, required: false, schema: { type: string }, description: Only snapshots taken from this sandbox (kept after the sandbox is deleted). }
      responses:
        "200":
          description: The owner's snapshots, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { const: list }
                  data: { type: array, items: { $ref: "#/components/schemas/Snapshot" } }
  /v1/snapshots/import:
    parameters: [{ $ref: "#/components/parameters/Owner" }]
    post:
      summary: Upload a workspace snapshot
      description: |
        The body is a tar archive of workspace files (`.tar.gz`; a plain `.tar` is compressed on arrival), sent
        as `application/gzip` or `application/octet-stream`. It becomes a new `ready` `workspace` snapshot of the
        owner with no source sandbox (`sandbox_id` is null), usable for restore and for creating a sandbox. Needs
        `AGENTRY_SANDBOX_SNAPSHOT_DIR` (else 400 `snapshots_off`) and counts against the per-owner snapshot limit.
        Every entry is checked before it is kept: 400 `invalid_request` for absolute paths, `..`, symlinks or hard
        links that point outside the workspace, device files and other special entries, or a file that is not a tar.
        413 when the upload is larger than `AGENTRY_SANDBOX_SNAPSHOT_IMPORT_MAX_MB` (default 2048), or unpacks to
        more than four times that.
      parameters:
        - { name: name, in: query, required: false, schema: { type: string, maxLength: 200 }, description: Name for the snapshot; default "Uploaded" plus the time. }
      requestBody:
        required: true
        content:
          application/gzip: { schema: { type: string, format: binary } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "201": { $ref: "#/components/responses/Snapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/snapshots/{id}/download:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Owner" }]
    get:
      summary: Download a workspace snapshot
      description: "Streams the snapshot's tar as `application/gzip` (an attachment, with `Content-Length`). 400 for a `disk` or `memory` snapshot (or one kept on a place), 409 `snapshot_not_ready` while saving or failed."
      responses:
        "200": { description: The archive., content: { application/gzip: { schema: { type: string, format: binary } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/snapshots/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Owner" }]
    get:
      summary: Get a snapshot
      responses:
        "200": { $ref: "#/components/responses/Snapshot" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a snapshot and its bytes (cancels one still being taken)
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/envd/{path}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/Owner" }
      - name: path
        in: path
        required: true
        description: An envd path (`process.Process/Start`, `filesystem.Filesystem/Stat`, `files`, `health`…), relayed with the sandbox's access token. Any method; GET and POST are listed.
        schema: { type: string }
      - name: X-Envd-User
        in: header
        required: false
        description: The Unix user envd runs the call as (sent to envd as Basic auth).
        schema: { type: string }
    get:
      summary: Relay a call to the sandbox's envd
      responses:
        default: { description: "envd's response, streamed." }
    post:
      summary: Relay a call to the sandbox's envd
      responses:
        default: { description: "envd's response, streamed." }
  /v1/sandboxes/{id}/ports/{port}/{path}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/Owner" }
      - name: port
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 65535 }
      - name: path
        in: path
        required: true
        description: A path on the web app listening on that port inside the sandbox. Any method; GET and POST are listed. The app must listen on 0.0.0.0 (not only 127.0.0.1). Docker places only; others answer 501 `port_preview_unsupported`.
        schema: { type: string }
    get:
      summary: Proxy a request to a port inside the sandbox
      responses:
        default: { description: "The app's response, streamed." }
    post:
      summary: Proxy a request to a port inside the sandbox
      responses:
        default: { description: "The app's response, streamed." }
  /v1/templates:
    post:
      summary: Create a template
      parameters: [{ $ref: "#/components/parameters/Owner" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                spec: { $ref: "#/components/schemas/TemplateSpec" }
      responses:
        "201": { $ref: "#/components/responses/Template" }
        "400": { $ref: "#/components/responses/Error" }
    get:
      summary: List templates
      parameters: [{ $ref: "#/components/parameters/Owner" }]
      responses:
        "200":
          description: The owner's templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { const: list }
                  data: { type: array, items: { $ref: "#/components/schemas/Template" } }
  /v1/templates/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Owner" }]
    get:
      summary: Get a template
      responses:
        "200": { $ref: "#/components/responses/Template" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Update a template (existing sandboxes keep their snapshot)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                spec: { $ref: "#/components/schemas/TemplateSpec" }
      responses:
        "200": { $ref: "#/components/responses/Template" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a template
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/places:
    get:
      summary: Admin. List places with their state
      description: Needs an admin key (not an API key).
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Every place.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/AdminPlace" } } } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Admin. Add a place
      description: "`host_key` is the fingerprint a successful test returned; it is pinned (SSH kinds only; an `e2b` place needs none)."
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, config]
              properties:
                name: { type: string }
                kind: { enum: [docker-ssh, ssh-machine, e2b] }
                config: { type: object }
                secrets: { type: object, additionalProperties: { type: string }, description: Sealed at rest and never returned. }
                host_key: { type: string, pattern: "^SHA256:" }
                max_running: { type: [integer, "null"] }
      responses:
        "201": { description: The place., content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlace" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/admin/places/test:
    post:
      summary: Admin. Test a connection without trusting the host key
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, config]
              properties:
                kind: { type: string }
                config: { type: object }
                secrets: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: The result, with the host key fingerprint seen and the GPUs found.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  reason: { type: string }
                  host_key: { type: string }
                  gpus: { $ref: "#/components/schemas/Gpus" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/admin/places/{id}:
    put:
      summary: Admin. Change a place
      description: "Fields are optional; `secrets` replaces the stored ones when present. `default` can only be set to true."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                config: { type: object }
                secrets: { type: object, additionalProperties: { type: string } }
                host_key: { type: string }
                enabled: { type: boolean }
                default: { const: true }
                max_running: { type: [integer, "null"] }
      responses:
        "200": { description: The place., content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlace" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Admin. Delete a place
      description: "`place_in_use` 409 while it has sandboxes; the `local` place cannot be deleted (400)."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted. }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/keys:
    get:
      summary: Admin. List owner-bound access keys
      description: "Never returns a key or its hash."
      security: [{ bearer: [] }]
      responses:
        "200": { description: The keys., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    post:
      summary: Admin. Create an owner-bound access key
      description: "The key (`ask_...`) is in this response only; it is stored as a hash. It acts as `owner`, on `/v1` and on `/mcp`, whatever X-Agentry-Owner says."
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner]
              properties:
                name: { type: string }
                owner: { type: string }
      responses:
        "201": { description: The key record with `key`., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/admin/keys/{id}:
    delete:
      summary: Admin. Revoke an access key
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/snapshots:
    get:
      summary: Admin. Every owner's snapshots
      security: [{ bearer: [] }]
      responses:
        "200": { description: The snapshots, newest first, each with its `owner`., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /v1/admin/snapshots/{id}:
    delete:
      summary: Admin. Delete a snapshot
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    Owner:
      name: X-Agentry-Owner
      in: header
      required: true
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Sandbox:
      description: A sandbox.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Sandbox" }
    Snapshot:
      description: A snapshot.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Snapshot" }
    Template:
      description: A template.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Template" }
    Error:
      description: "`unauthorized` 401, `owner_required` 400, `invalid_request` 400 (also a template over the per-sandbox CPU or memory maximum), `not_found` 404, `sandbox_failed` 409, `quota_exceeded` 429 (a sandbox, running or creation-rate limit; the message says which), `place_unavailable` 503 (the message names the place), `snapshots_off` 400 (no `AGENTRY_SANDBOX_SNAPSHOT_DIR`), `snapshot_not_ready` 409, `place_disabled` 409, `gpu_unavailable` 409 (the place has too few free GPUs; the message says how many of how many). Admin routes also use `place_in_use` 409 and `place_host_key_changed` 409."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    TemplateSpec:
      type: object
      properties:
        image: { type: string, description: "Any Linux image; the default sandbox image when absent." }
        packages: { type: array, items: { type: string }, description: Installed with apt-get or apk on first start. }
        setup_commands: { type: array, items: { type: string }, description: "Run as `agent` in /workspace on first start." }
        env: { type: object, additionalProperties: { type: string } }
        network: { type: boolean, default: true, description: "false: no outbound connections." }
        files:
          type: array
          items:
            type: object
            required: [path, content]
            properties:
              path: { type: string, description: Relative paths are under /workspace. }
              content: { type: string }
        resources:
          type: object
          properties:
            cpus: { type: number, minimum: 0.1, maximum: 64 }
            memory_mb: { type: integer, minimum: 128, maximum: 262144 }
        place: { type: string, description: Id of the place to run on. }
        gpus: { oneOf: [{ type: integer, minimum: 0 }, { const: all }], description: "GPUs to give the sandbox; the place needs GPU support." }
    Sandbox:
      type: object
      required: [id, object, name, backend, state, image, template, created_at]
      properties:
        id: { type: string, pattern: "^sbx_[0-9a-f]{32}$" }
        object: { const: sandbox }
        name: { type: string }
        backend: { type: string, description: Same as `place`. }
        place: { type: string }
        gpus: { oneOf: [{ type: integer, minimum: 0 }, { const: all }] }
        state: { enum: [provisioning, running, stopped, failed, deleting] }
        template_id: { type: [string, "null"] }
        image: { type: string }
        template: { $ref: "#/components/schemas/TemplateSpec" }
        error: { type: [string, "null"] }
        progress: { $ref: "#/components/schemas/Progress" }
        created_at: { type: integer }
        started_at: { type: [integer, "null"] }
        last_used_at: { type: [integer, "null"] }
    Progress:
      type: object
      description: Where a provisioning sandbox is in its setup. Present only while `state` is `provisioning`.
      required: [stage, updated_at]
      properties:
        stage: { enum: [pulling_image, starting, preparing, installing_packages, copying_runtime, writing_files, running_setup, finishing] }
        step: { type: integer, description: "`running_setup` only: the setup command being run (1-based)." }
        steps: { type: integer, description: "`running_setup` only: how many setup commands there are." }
        detail: { type: string, description: "`running_setup` only: the command, cut to 120 characters." }
        updated_at: { type: integer }
    Snapshot:
      type: object
      required: [id, object, sandbox_id, place, level, name, state, created_at]
      properties:
        id: { type: string, pattern: "^snap_[0-9a-f]{32}$" }
        object: { const: snapshot }
        sandbox_id: { type: [string, "null"], description: "The sandbox it was taken from (kept after that sandbox is deleted); null for an uploaded snapshot." }
        place: { type: string, description: "`service` for a workspace tar kept on the service host, else the place that holds it." }
        level: { enum: [workspace, disk, memory] }
        name: { type: string }
        state: { enum: [saving, ready, failed] }
        size_bytes: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        created_at: { type: integer }
        expires_at: { type: [integer, "null"], description: "The sweep deletes the snapshot after this (AGENTRY_SANDBOX_SNAPSHOT_DAYS)." }
    Template:
      type: object
      required: [id, object, name, spec, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^tpl_[0-9a-f]{32}$" }
        object: { const: template }
        name: { type: string }
        spec: { $ref: "#/components/schemas/TemplateSpec" }
        created_at: { type: integer }
        updated_at: { type: integer }
    Gpus:
      type: object
      properties:
        count: { type: integer }
        models: { type: array, items: { type: string } }
    AdminPlace:
      type: object
      description: A place as the admin sees it. Credentials are never returned; `has_secrets` says whether any are stored.
      required: [id, name, kind, enabled, default, config, has_secrets, available, gpus, sandboxes]
      properties:
        id: { type: string }
        name: { type: string }
